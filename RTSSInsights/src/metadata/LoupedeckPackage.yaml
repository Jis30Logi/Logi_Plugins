# ==================================================================================================
# Package descriptor read by the Logi Plugin Service at plugin discovery.
#
# This is the file the service actually reads. A plugin4 package is a folder (or a .lplug4 zip of
# that folder) containing metadata/LoupedeckPackage.yaml plus the folder named by pluginFolderWin.
# The root-level .lplug4 JSON manifest is NOT what discovery reads; deploying only that makes the
# service skip the plugin in total silence.
# ==================================================================================================

# Package type. Must be plugin4 for plugins.
type: plugin4

# Name that identifies the plugin.
name: RTSSPerformance

# Plugin name that is shown to the user.
displayName: "RTSS Insights"

# Short description of the plugin.
description: "Live RTSS performance telemetry, analytics, and control on your Logitech MX Creative Console."

# Name of the plugin library file.
pluginFileName: RTSSPerformancePlugin.dll

# Plugin version.
version: 1.0.4

author: ""
copyright: ""

# ==================================================================================================
# PLUGIN PROPERTIES
# ==================================================================================================

# Location of plugin files on Windows, relative to the plugin base directory.
pluginFolderWin: bin

# Windows-only: RTSS does not exist on macOS, so pluginFolderMac is omitted.

# Devices the plugin is offered for. Must list specific families, not "All".
supportedDevices:
  - LoupedeckCtFamily
  - LoupedeckPlusFamily
  - LogitechCreativeFamily


# List of plugin capabilities.
pluginCapabilities:
    # HasApplication is deliberately NOT set: this plugin targets no host application. It reads
    # RTSS shared memory and edits RTSS profile files directly, which is why the Plugin class
    # declares HasNoApplication => true and UsesApplicationApiOnly => false.

    # ActivatesApplication is deliberately NOT set: the plugin sends no keyboard shortcuts.

# Minimum Loupedeck version supported by the plugin.
minimumLoupedeckVersion: 6.0
