# ==================================================================================================
# GENERAL SETTINGS
# ==================================================================================================

# Package type. Must be plugin4 for plugins.
type: plugin4

# Name that identifies the plugin.
name: ETS2

# Plugin name that is shown to the user.
displayName: Euro Truck Simulator 2

# Short description of the plugin.
description: Real-time telemetry indicators for Euro Truck Simulator 2 - Speed, Fuel, Parking Brake, Engine Damage, and Fatigue warnings.

# Name of the plugin library file.
pluginFileName: ETS2Plugin.dll

# Plugin version.
version: 1.0

# Author of the plugin.
author: Your Name

# Copyright information.
copyright: Copyright © 2026. All rights reserved.


# ==================================================================================================
# PLUGIN PROPERTIES
# ==================================================================================================

# Location of plugin files on Windows (relative to the plugin base directory).
# This parameter is required to support Windows.
pluginFolderWin: bin

# Location of plugin files on macOS (relative to the plugin base directory).
# This parameter is required to support Mac.
pluginFolderMac: bin

# List of devices the plugin is optimized for.
supportedDevices:
    # LoupedeckCtFamily covers: Loupedeck CT, Live, Live S, Razer Stream Controller
    - LoupedeckCtFamily

    # LogitechCreativeFamily covers Logitech MX Creative Console
    - LogitechCreativeFamily

# List of plugin capabilities.
pluginCapabilities:
    # This plugin is an API-only plugin (no target application)

# Minimum Loupedeck version supported by the plugin.
minimumLoupedeckVersion: 6.0


# ==================================================================================================
# LOUPEDECK MARKETPLACE SETTINGS
# ==================================================================================================

# Name of the license that the plugin is licensed under.
license: MIT

# URL of the plugin license.
licenseUrl: https://opensource.org/licenses/MIT

# URL of the support page where users can send improvement suggestions and report bugs.
#supportPageUrl: https://github.com/yourusername/ets2-loupedeck-plugin/issues

# URL of the plugin homepage.
#homePageUrl: https://github.com/yourusername/ets2-loupedeck-plugin
